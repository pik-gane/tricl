dynamics:

    [state, is in, system]:
        establish:
            attempt:
                base: entry  # entry rate per non-member state
            success: inf
        terminate:
            attempt:
                base: exit  # exit rate per member state
            success: inf

    [state, defense, state]:
        establish:
            attempt:
                [~, is in, system, contains, ~]: a0_defense  # spontaneous formation rate per pair of member states
                [~, defense, state, defense, ~]: a1_defense  # additional rate per common ally
            success: inf
        terminate:
            attempt:
                base: d0_defense  # dissolution attempt rate; success probability 1/2 without common allies
            success:
                tails: 0
                [~, defense, state, defense, ~]: -b1_defense  # each common ally lowers the success probability units
