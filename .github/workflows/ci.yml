name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libyaml-cpp-dev libboost-dev zlib1g-dev graphviz

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j 2

      - name: Run tests
        run: python3 tests/run_tests.py --bin build/src/tricl

      - name: Run an example with --debug consistency checks (Debug build only)
        if: matrix.build_type == 'Debug'
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/build/src/tricl" "$GITHUB_WORKSPACE/tests/configs/two_entities.yaml" --debug --seed 1 > debug.log
          tail -n 3 debug.log
