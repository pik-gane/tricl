name: Docs

# Builds the doxygen code documentation and publishes it to the gh-pages branch.
# (In the repository settings, GitHub Pages must be configured to serve from the gh-pages branch.)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doxygen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/html
          destination_dir: html
          enable_jekyll: false
